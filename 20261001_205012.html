<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI 投資儀表板">
    <title>Gemini 智慧全球投資儀表板</title>
    
    <!-- 引入 Tailwind CSS 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #111827; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 台灣股市習慣：紅漲綠跌 */
        .text-up { color: #ef4444; } 
        .text-down { color: #22c55e; } 
        .bg-up { background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); }
        .bg-down { background-color: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); }
        
        /* 載入動畫與滑動效果 */
        .loader { border-top-color: #3b82f6; -webkit-animation: spinner 1s linear infinite; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slideUp { animation: slideUp 0.3s ease-out forwards; }
        .animate-slideDown { animation: slideDown 0.2s ease-out forwards; }
        
        /* AI 分析報告 Markdown 樣式 */
        .markdown-body h3 { font-size: 1.15em; font-weight: bold; color: #60a5fa; margin-top: 16px; margin-bottom: 8px; border-bottom: 1px solid #374151; padding-bottom: 4px; }
        .markdown-body p { margin-bottom: 12px; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; margin-left: 20px; margin-bottom: 12px; }
        .markdown-body li { margin-bottom: 6px; line-height: 1.5; }
        .markdown-body strong { color: #fbbf24; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 預設關注清單
        const defaultSymbols = ['^TWII', '2330.TW', 'NVDA', 'BTC-USD'];

        // 簡單的 Markdown 轉 HTML 函數
        const parseMarkdown = (text) => {
            if (!text) return "";
            let html = text
                .replace(/### (.*?)\n/g, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\* (.*?)\n/g, '<li>$1</li>')
                .replace(/\n\n/g, '</p><p>');
            return `<p>${html}</p>`.replace(/<p><\/p>/g, '');
        };

        // 彈出式 AI 分析視窗元件
        const AIAnalysisModal = ({ stock, apiKey, onClose }) => {
            const [loading, setLoading] = useState(true);
            const [aiResponse, setAiResponse] = useState("");
            const [errorMsg, setErrorMsg] = useState("");

            useEffect(() => {
                const fetchGeminiAnalysis = async () => {
                    if (!apiKey) {
                        setErrorMsg("請先關閉此視窗，點擊右上角「⚙️」設定您的 Gemini API Key！");
                        setLoading(false);
                        return;
                    }

                    const s = stock;
                    // 精心設計的 Prompt，要求 Gemini 結合即時數據與其知識庫進行技術、基本、籌碼與建議分析
                    const prompt = `
                    你是一位頂尖的華爾街量化與基本面分析師。請根據以下即時數據，並結合你對該標的近期的市場認知與歷史走勢，為這檔投資標的寫一份簡潔、專業的分析報告。
                    
                    【即時數據】
                    標的名稱：${s.shortName || s.longName || s.symbol} (${s.symbol})
                    目前價格：${s.regularMarketPrice}
                    單日漲跌幅：${s.regularMarketChangePercent}%
                    50日均線：${s.fiftyDayAverage || '無'}
                    本益比(PE)：${s.trailingPE || '無'}
                    近四季EPS：${s.epsTrailingTwelveMonths || '無'}
                    當日成交量：${s.regularMarketVolume || '無'}
                    
                    請用繁體中文回答，包含以下結構，排版請嚴格使用 Markdown 標題格式 (### 標題)：
                    
                    ### 📈 技術面分析
                    (請涵蓋 K線型態、MACD趨勢推估、KDJ指標狀態、以及成交量變化的綜合判斷)
                    
                    ### 🏢 基本面分析
                    (評估目前估值、財報獲利表現。若為虛擬貨幣或期貨，請依其總經資產特性分析)
                    
                    ### 🤝 籌碼面分析
                    (依據近期走勢與市場熱度，推估近期三大法人、主力或散戶的資金動向)
                    
                    ### 💡 AI 投資建議
                    (給出具體的短、中、長期操作策略與風險提示)
                    `;

                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                        const response = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }]
                            })
                        });

                        const data = await response.json();
                        
                        if (data.error) {
                            setErrorMsg(`API 錯誤: ${data.error.message}`);
                        } else if (data.candidates && data.candidates.length > 0) {
                            setAiResponse(data.candidates[0].content.parts[0].text);
                        } else {
                            setErrorMsg("無法產生分析，請稍後再試。");
                        }
                    } catch (err) {
                        setErrorMsg("連線失敗，請檢查網路狀態或 API Key 是否正確。");
                    } finally {
                        setLoading(false);
                    }
                };

                fetchGeminiAnalysis();
            }, [stock, apiKey]);

            const isUp = stock.regularMarketChange >= 0;
            const colorClass = isUp ? 'text-up' : 'text-down';

            return (
                <div className="fixed inset-0 z-50 flex items-end justify-center bg-black bg-opacity-80 sm:items-center p-4">
                    <div className="bg-gray-800 w-full max-w-md rounded-2xl sm:rounded-xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh] animate-slideUp">
                        
                        {/* 視窗頂部標題與即時報價 */}
                        <div className="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-900">
                            <div>
                                <div className="text-xl font-bold">{stock.shortName || stock.symbol}</div>
                                <div className="flex items-baseline space-x-2 mt-1">
                                    <span className="text-2xl font-bold">{stock.regularMarketPrice?.toFixed(2)}</span>
                                    <span className={`text-sm font-semibold ${colorClass}`}>
                                        {isUp ? '▲' : '▼'} {Math.abs(stock.regularMarketChange || 0).toFixed(2)} 
                                        ({stock.regularMarketChangePercent > 0 ? '+' : ''}{stock.regularMarketChangePercent?.toFixed(2)}%)
                                    </span>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 bg-gray-700 rounded-full hover:bg-gray-600 transition">✕</button>
                        </div>

                        {/* AI 報告內容區 */}
                        <div className="p-5 overflow-y-auto hide-scrollbar min-h-[350px]">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-full space-y-4 pt-16">
                                    <div className="w-12 h-12 border-4 border-gray-600 rounded-full loader"></div>
                                    <p className="text-blue-400 font-medium animate-pulse">Gemini 正在分析技術與籌碼指標...</p>
                                </div>
                            ) : errorMsg ? (
                                <div className="bg-red-900 bg-opacity-40 border border-red-500 text-red-300 p-4 rounded-xl mt-4">
                                    ⚠ {errorMsg}
                                </div>
                            ) : (
                                <div 
                                    className="markdown-body text-sm text-gray-200"
                                    dangerouslySetInnerHTML={{ __html: parseMarkdown(aiResponse) }}
                                ></div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 主應用程式
        const App = () => {
            const [symbols, setSymbols] = useState(() => JSON.parse(localStorage.getItem('myWatchlist')) || defaultSymbols);
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('geminiApiKey') || "");
            const [showSettings, setShowSettings] = useState(false);
            
            const [stocksData, setStocksData] = useState([]);
            const [selectedStock, setSelectedStock] = useState(null);
            const [newSymbol, setNewSymbol] = useState("");
            const [isFetching, setIsFetching] = useState(false);

            // 當清單變更時，儲存到 LocalStorage
            useEffect(() => { localStorage.setItem('myWatchlist', JSON.stringify(symbols)); }, [symbols]);
            
            const saveApiKey = (e) => {
                const key = e.target.value.trim();
                setApiKey(key);
                localStorage.setItem('geminiApiKey', key);
            };

            // 抓取 Yahoo 財經資料
            const fetchMarketData = async () => {
                if (symbols.length === 0) return setStocksData([]);
                setIsFetching(true);
                try {
                    const symbolQuery = symbols.join(',');
                    // 透過 allorigins 代理伺服器繞過 CORS 限制
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbolQuery}`)}`;
                    const response = await fetch(proxyUrl);
                    const data = await response.json();
                    if (data.contents) {
                        const parsed = JSON.parse(data.contents);
                        if (parsed.quoteResponse?.result) {
                            // 保持使用者自訂清單的排序
                            const sortedData = symbols.map(sym => 
                                parsed.quoteResponse.result.find(s => s.symbol === sym)
                            ).filter(Boolean);
                            setStocksData(sortedData);
                        }
                    }
                } catch (error) {
                    console.error("抓取報價失敗", error);
                } finally {
                    setIsFetching(false);
                }
            };

            // 初始載入與每 15 秒更新一次報價
            useEffect(() => {
                fetchMarketData();
                const interval = setInterval(fetchMarketData, 15000);
                return () => clearInterval(interval);
            }, [symbols]);

            const handleAddSymbol = (e) => {
                e.preventDefault();
                const clean = newSymbol.trim().toUpperCase();
                if (clean && !symbols.includes(clean)) setSymbols([...symbols, clean]);
                setNewSymbol("");
            };

            const removeSymbol = (e, sym) => {
                e.stopPropagation();
                setSymbols(symbols.filter(s => s !== sym));
            };

            return (
                <div className="min-h-screen bg-gray-900 pb-20 relative">
                    
                    {/* 頂部導覽列 */}
                    <div className="sticky top-0 z-10 bg-gray-900 border-b border-gray-800 p-4 shadow-md flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold tracking-wider">Gemini 智慧自選股</h1>
                            <div className="text-xs text-gray-400 mt-1">
                                {isFetching ? <span className="text-yellow-500">● 同步報價中...</span> : <span className="text-green-500">● 即時報價連線正常</span>}
                            </div>
                        </div>
                        {/* API Key 設定按鈕 */}
                        <button 
                            onClick={() => setShowSettings(!showSettings)} 
                            className={`p-2 rounded-full transition ${showSettings ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}
                        >
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                    </div>

                    {/* Gemini API Key 設定面板 */}
                    {showSettings && (
                        <div className="bg-gray-800 p-5 border-b border-gray-700 animate-slideDown shadow-inner">
                            <label className="block text-sm text-blue-400 font-bold mb-2">🔑 設定您的 Gemini API Key</label>
                            <input 
                                type="password" 
                                value={apiKey}
                                onChange={saveApiKey}
                                placeholder="貼上 Google AI Studio 取得的金鑰" 
                                className="w-full bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"
                            />
                            <p className="text-xs text-gray-400 mt-3 leading-relaxed">
                                * 金鑰僅安全地儲存在您當前設備的瀏覽器中，關閉或重新整理不會消失，且不會上傳至任何外部伺服器。
                            </p>
                        </div>
                    )}

                    <div className="p-4 space-y-5 mt-2">
                        {/* 新增標的輸入框 */}
                        <form onSubmit={handleAddSymbol} className="flex space-x-2">
                            <input 
                                type="text" 
                                value={newSymbol}
                                onChange={(e) => setNewSymbol(e.target.value)}
                                placeholder="輸入代碼 (如 2330.TW, AAPL, BTC-USD)" 
                                className="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 shadow-sm"
                            />
                            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-bold shadow-md transition active:scale-95">加入</button>
                        </form>
                        
                        {/* 報價清單 */}
                        <div className="space-y-3">
                            {stocksData.map((stock) => {
                                const price = stock.regularMarketPrice || 0;
                                const percent = stock.regularMarketChangePercent || 0;
                                const isUp = percent >= 0;

                                return (
                                    <div 
                                        key={stock.symbol} 
                                        onClick={() => setSelectedStock(stock)}
                                        className="bg-gray-800 rounded-xl p-4 flex justify-between items-center shadow-md active:scale-95 transition-transform cursor-pointer border border-gray-700 hover:border-gray-500 relative overflow-hidden"
                                    >
                                        <div className="flex-1 pr-4">
                                            <div className="font-bold text-lg truncate">{stock.shortName || stock.symbol}</div>
                                            <div className="text-gray-400 text-xs mt-1 bg-gray-700 inline-block px-2 py-0.5 rounded">{stock.symbol}</div>
                                        </div>
                                        
                                        <div className="text-right mr-8">
                                            <div className="font-bold text-xl">{price.toFixed(2)}</div>
                                            <div className={`mt-1 text-sm font-semibold py-1 px-2 rounded inline-block shadow-sm ${isUp ? 'text-up bg-up' : 'text-down bg-down'}`}>
                                                {isUp ? '▲' : '▼'} {percent > 0 ? '+' : ''}{percent.toFixed(2)}%
                                            </div>
                                        </div>

                                        {/* 刪除按鈕 */}
                                        <button 
                                            onClick={(e) => removeSymbol(e, stock.symbol)} 
                                            className="absolute top-0 right-0 h-full px-4 text-gray-500 hover:text-red-400 hover:bg-red-900 hover:bg-opacity-20 transition"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                );
                            })}

                            {stocksData.length === 0 && !isFetching && (
                                <div className="text-center text-gray-500 py-10">您的觀察清單目前是空的。</div>
                            )}
                        </div>
                    </div>

                    {/* AI 報告彈出視窗 */}
                    {selectedStock && <AIAnalysisModal stock={selectedStock} apiKey={apiKey} onClose={() => setSelectedStock(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
